name: CI & Fast Check

on:
  push:
    tags:
      - 'v*' # Run full checks on release version tags (e.g. v0.1.0)
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - '.gitignore'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck & Cargo Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cargo Caching
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          # PR jobs may read but never write the cache — PR-controlled code
          # must not poison entries reused by release builds.
          save-if: github.ref == 'refs/heads/main'

      - name: Install Node dependencies
        run: npm ci

      - name: TypeScript & Vite Build Check
        run: npm run build

      - name: Cargo Check
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Cargo Audit
        working-directory: src-tauri
        run: cargo audit
