name: Android CI & Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
    paths-ignore:
      - '**.md'
      - '.gitignore'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build format to produce'
        required: true
        default: 'both'
        type: choice
        options:
          - 'apk'
          - 'aab'
          - 'both'
      targets:
        description: 'Android ABI targets to compile'
        required: false
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'aarch64'
          - 'armv7'
          - 'x86_64'
          - 'i686'

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c
          add-to-path: true

      - name: Set Android Environment Variables
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV
          echo "NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: |
            aarch64-linux-android
            armv7-linux-androideabi
            x86_64-linux-android
            i686-linux-android

      - name: Rust Cargo Caching
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Node dependencies
        run: npm ci

      - name: Setup Android Keystore (Release Signing)
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > src-tauri/gen/android/app/release.keystore
          echo "TAURI_STORE_FILE=release.keystore" >> $GITHUB_ENV
          echo "TAURI_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> $GITHUB_ENV
          echo "TAURI_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> $GITHUB_ENV
          echo "TAURI_STORE_PASSWORD=$ANDROID_STORE_PASSWORD" >> $GITHUB_ENV

      - name: Build Android APK
        if: inputs.build_type == 'apk' || inputs.build_type == 'both' || inputs.build_type == null || github.event_name != 'workflow_dispatch'
        run: |
          if [ "${{ inputs.targets }}" != "" ] && [ "${{ inputs.targets }}" != "all" ]; then
            npm run tauri android build -- --target ${{ inputs.targets }} --apk
          else
            npm run tauri android build -- --apk
          fi

      - name: Build Android App Bundle (AAB)
        if: inputs.build_type == 'aab' || inputs.build_type == 'both' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
        run: |
          if [ "${{ inputs.targets }}" != "" ] && [ "${{ inputs.targets }}" != "all" ]; then
            npm run tauri android build -- --target ${{ inputs.targets }} --aab
          else
            npm run tauri android build -- --aab
          fi

      - name: Stage Android Artifacts
        run: |
          mkdir -p staging
          # Copy APKs
          if [ -d "src-tauri/gen/android/app/build/outputs/apk" ]; then
            find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" | while read -r apk; do
              filename=$(basename "$apk")
              clean_name=$(echo "$filename" | sed -e 's/app-//g' -e 's/-unsigned//g' -e 's/-signed//g')
              cp "$apk" "staging/DynastyReader-${clean_name}"
            done
          fi
          # Copy AABs
          if [ -d "src-tauri/gen/android/app/build/outputs/bundle" ]; then
            find src-tauri/gen/android/app/build/outputs/bundle -name "*.aab" | while read -r aab; do
              filename=$(basename "$aab")
              clean_name=$(echo "$filename" | sed -e 's/app-//g' -e 's/-unsigned//g' -e 's/-signed//g')
              cp "$aab" "staging/DynastyReader-${clean_name}"
            done
          fi
          echo "Staged artifacts:"
          ls -la staging/

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DynastyReader-android-${{ github.sha }}
          path: staging/*
          if-no-files-found: error
          retention-days: 14

      - name: Publish Android Release Assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: 'DynastyReader ${{ github.ref_name }}'
          draft: false
          prerelease: false
          files: staging/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
