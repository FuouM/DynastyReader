name: Release Build & Publish

on:
  push:
    tags:
      - 'v*' # Trigger only on version tags (e.g. v0.1.0)
  workflow_dispatch: # Allows manual triggering from GitHub UI

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    name: Build (${{ matrix.platform }})
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            os_name: 'windows'
          - platform: 'ubuntu-22.04'
            os_name: 'linux'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Linux build dependencies
        if: matrix.os_name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Node dependencies
        run: npm ci

      - name: Build Windows Standalone Executable
        if: matrix.os_name == 'windows'
        run: npm run tauri build -- --no-bundle

      - name: Build Linux AppImage & Debian Package
        if: matrix.os_name == 'linux'
        run: npm run tauri build -- --bundles appimage,deb

      - name: Stage Windows Artifacts
        if: matrix.os_name == 'windows'
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path staging -Force | Out-Null
          if (Test-Path "src-tauri\target\release\DynastyReader.exe") {
            Copy-Item "src-tauri\target\release\DynastyReader.exe" "staging\DynastyReader.exe" -Force
          } elseif (Test-Path "src-tauri\target\release\dynasty-scans-reader.exe") {
            Copy-Item "src-tauri\target\release\dynasty-scans-reader.exe" "staging\DynastyReader.exe" -Force
          } else {
            throw "Compiled executable not found in src-tauri\target\release!"
          }

      - name: Stage Linux Artifacts
        if: matrix.os_name == 'linux'
        shell: bash
        run: |
          mkdir -p staging
          find src-tauri/target/release/bundle/appimage -name "*.AppImage" -exec cp {} staging/DynastyReader-x86_64.AppImage \;
          find src-tauri/target/release/bundle/deb -name "*.deb" -exec cp {} staging/ \;

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          name: 'DynastyReader ${{ github.ref_name }}'
          draft: false
          prerelease: false
          files: staging/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
