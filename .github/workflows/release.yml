name: Release Build & Publish

on:
  push:
    tags:
      - 'v*' # Trigger only on version tags (e.g. v0.1.0)
  workflow_dispatch: # Allows manual triggering from GitHub UI
    inputs:
      platform:
        description: 'Platform(s) to build'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'desktop'
          - 'android'
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  build-desktop:
    name: Build (${{ matrix.platform }})
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'desktop'
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            os_name: 'windows'
          - platform: 'ubuntu-22.04'
            os_name: 'linux'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Linux build dependencies
        if: matrix.os_name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          prefix-key: "release-desktop"

      - name: Install Node dependencies
        run: npm ci

      - name: Build Windows Standalone Executable
        if: matrix.os_name == 'windows'
        run: npm run tauri build -- --no-bundle

      - name: Build Linux AppImage & Debian Package
        if: matrix.os_name == 'linux'
        run: npm run tauri build -- --bundles appimage,deb

      - name: Stage Windows Artifacts
        if: matrix.os_name == 'windows'
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path staging -Force | Out-Null
          if (Test-Path "src-tauri\target\release\DynastyReader.exe") {
            Copy-Item "src-tauri\target\release\DynastyReader.exe" "staging\DynastyReader.exe" -Force
          } elseif (Test-Path "src-tauri\target\release\dynasty-scans-reader.exe") {
            Copy-Item "src-tauri\target\release\dynasty-scans-reader.exe" "staging\DynastyReader.exe" -Force
          } else {
            throw "Compiled executable not found in src-tauri\target\release!"
          }

      - name: Stage Linux Artifacts
        if: matrix.os_name == 'linux'
        shell: bash
        run: |
          mkdir -p staging
          find src-tauri/target/release/bundle/appimage -name "*.AppImage" -exec cp {} staging/DynastyReader-x86_64.AppImage \;
          find src-tauri/target/release/bundle/deb -name "*.deb" -exec cp {} staging/ \;

      - name: Generate Checksums
        shell: bash
        run: |
          cd staging
          sha256sum * | tee checksums.txt

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: staging/*

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          name: 'DynastyReader ${{ github.ref_name }}'
          draft: false
          prerelease: false
          files: staging/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-android:
    name: Build (android)
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'android'
    permissions:
      contents: write
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android NDK
        run: |
          if [ -n "$ANDROID_NDK_HOME" ] && [ -d "$ANDROID_NDK_HOME" ]; then
            echo "Using runner preinstalled NDK at $ANDROID_NDK_HOME"
            echo "ANDROID_HOME=${ANDROID_SDK_ROOT:-$ANDROID_HOME}" >> $GITHUB_ENV
            echo "NDK_HOME=$ANDROID_NDK_HOME" >> $GITHUB_ENV
            echo "$ANDROID_NDK_HOME" >> $GITHUB_PATH
          elif [ -d "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/ndk" ]; then
            SELECTED_NDK=$(ls -1d ${ANDROID_SDK_ROOT:-$ANDROID_HOME}/ndk/* 2>/dev/null | sort -V | tail -n 1)
            echo "Using discovered runner NDK at $SELECTED_NDK"
            echo "ANDROID_HOME=${ANDROID_SDK_ROOT:-$ANDROID_HOME}" >> $GITHUB_ENV
            echo "ANDROID_NDK_HOME=$SELECTED_NDK" >> $GITHUB_ENV
            echo "NDK_HOME=$SELECTED_NDK" >> $GITHUB_ENV
            echo "$SELECTED_NDK" >> $GITHUB_PATH
          else
            echo "::error::Android NDK not found in runner environment!"
            exit 1
          fi
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: |
            aarch64-linux-android
            armv7-linux-androideabi
            x86_64-linux-android

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          prefix-key: "release-android"
      - name: Install Node dependencies
        run: npm ci

      - name: Setup Android Keystore (Release Signing)
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          # Cleanly decode base64 keystore using Python to avoid any Windows CRLF / newline corruption
          python3 -c "import os, base64; open('src-tauri/gen/android/app/release.keystore', 'wb').write(base64.b64decode(os.environ['ANDROID_KEYSTORE_BASE64'].strip()))"

          # Auto-discover alias from keystore
          DISCOVERED_ALIAS=$(keytool -list -keystore src-tauri/gen/android/app/release.keystore -storepass "$ANDROID_STORE_PASSWORD" 2>/dev/null | grep -E "PrivateKeyEntry|keyEntry" | head -n 1 | awk -F',' '{print $1}' | xargs)

          KEYSTORE_ALIAS="${ANDROID_KEY_ALIAS:-$DISCOVERED_ALIAS}"
          if [ -n "$DISCOVERED_ALIAS" ] && [ -z "$ANDROID_KEY_ALIAS" ]; then
            echo "Auto-detected keystore alias: $DISCOVERED_ALIAS"
          elif [ -n "$ANDROID_KEY_ALIAS" ]; then
            echo "Using configured keystore alias: $ANDROID_KEY_ALIAS"
          fi

          KEY_PASS="${ANDROID_KEY_PASSWORD:-$ANDROID_STORE_PASSWORD}"

          # Validate keystore can be read with the provided password and alias
          echo "Validating keystore integrity and alias..."
          if keytool -list -v -keystore src-tauri/gen/android/app/release.keystore -alias "$KEYSTORE_ALIAS" -storepass "$ANDROID_STORE_PASSWORD" >/dev/null 2>&1; then
            echo "Keystore and alias '$KEYSTORE_ALIAS' successfully verified!"
            echo "TAURI_STORE_FILE=release.keystore" >> $GITHUB_ENV
            echo "TAURI_KEY_ALIAS=$KEYSTORE_ALIAS" >> $GITHUB_ENV
            echo "TAURI_KEY_PASSWORD=$KEY_PASS" >> $GITHUB_ENV
            echo "TAURI_STORE_PASSWORD=$ANDROID_STORE_PASSWORD" >> $GITHUB_ENV
          else
            echo "::error ::Keystore or password verification failed for alias '$KEYSTORE_ALIAS'. Refusing to publish debug-signed release artifacts."
            exit 1
          fi
      - name: Build Android APK & App Bundle
        run: |
          npm run tauri android build -- --target aarch64 --target armv7 --target x86_64 --apk --aab

      - name: Stage Android Artifacts
        shell: bash
        run: |
          mkdir -p staging
          if [ -d "src-tauri/gen/android/app/build/outputs/apk" ]; then
            find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" | while read -r apk; do
              filename=$(basename "$apk")
              clean_name=$(echo "$filename" | sed -e 's/app-//g' -e 's/-unsigned//g' -e 's/-signed//g')
              cp "$apk" "staging/DynastyReader-${clean_name}"
            done
          fi
          if [ -d "src-tauri/gen/android/app/build/outputs/bundle" ]; then
            find src-tauri/gen/android/app/build/outputs/bundle -name "*.aab" | while read -r aab; do
              filename=$(basename "$aab")
              clean_name=$(echo "$filename" | sed -e 's/app-//g' -e 's/-unsigned//g' -e 's/-signed//g')
              cp "$aab" "staging/DynastyReader-${clean_name}"
            done
          fi
          ls -la staging/

      - name: Generate Checksums
        shell: bash
        run: |
          cd staging
          sha256sum * | tee checksums.txt

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: staging/*

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          name: 'DynastyReader ${{ github.ref_name }}'
          draft: false
          prerelease: false
          files: staging/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
