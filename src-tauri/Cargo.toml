[package]
name = "dynasty-scans-reader"
version = "0.3.4"
description = "Portable standalone Dynasty Scans reader"
authors = ["DynastyReader"]
edition = "2021"

[lib]
name = "dynasty_scans_reader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "devtools"] }
tauri-plugin-window-state = "2"
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
zip = { version = "2", default-features = false, features = ["deflate", "bzip2", "deflate64"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled", "backup"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
tokio = { version = "1", features = ["rt", "fs", "io-util", "sync", "macros", "time"] }
mimalloc = { version = "0.1", default-features = false }
tokio-stream = "0.1"
walkdir = "2"
webp = "0.3"
image = { version = "0.25", default-features = false, features = ["webp", "jpeg", "png", "gif", "bmp"] }
open = "5"
semver = "1.0"
tempfile = "3"
url = "2"

[profile.dev]
opt-level = 0
debug = 1

# Same hot-path opts as the root workspace so dev-mode image decode/encode
# reaches release-class speeds.
[profile.dev.package."image"]
opt-level = 3

[profile.dev.package."image-webp"]
opt-level = 3

[profile.dev.package."zune-jpeg"]
opt-level = 3

[profile.dev.package."zune-core"]
opt-level = 3

[profile.dev.package."png"]
opt-level = 3

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

# Self-contained workspace: this crate is NOT a member of the repo-root
# workspace, so it can be lifted into its own repo verbatim later.
[workspace]
