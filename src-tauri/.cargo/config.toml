# Dependency cooldown (Cargo 1.100+): the resolver ignores crate versions
# published less than 7 days ago unless they are already in Cargo.lock.
# This limits exposure to freshly published malicious releases.
# Override for an urgent fix: CARGO_RESOLVER_INCOMPATIBLE_PUBLISH_AGE=allow
[registry]
global-min-publish-age = "7 days"
